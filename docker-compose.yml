# Wormhole - Windows 11 in Docker - created by bhxuk.com
# Manual setup: put your Windows 11 ISO in ./iso, edit the values below, then:
#   docker compose up -d
# The interactive installer (install.sh) writes this file for you.
name: wormhole
services:
  windows:
    image: ghcr.io/bhxuk/wormhole:latest
    container_name: wormhole
    devices:
      - /dev/kvm
    environment:
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      COMPUTER_NAME: "WORMHOLE"
      USERNAME: "wormhole"
      PASSWORD: "change-me"
      EDITION: "Pro"
      KEYBOARD: "en-US"
      REGION: "en-US"
      TIMEZONE: "UTC"
    ports:
      - "8006:8006"        # browser
      - "3389:3389/tcp"    # RDP
      - "3389:3389/udp"
    volumes:
      - ./storage:/storage # Windows lives here - keep it
      - ./iso:/iso:ro      # folder containing the Windows 11 ISO
    restart: unless-stopped
    stop_grace_period: 2m
